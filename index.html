<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El-Pollo-Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/9_intro_outro_screens/start/startscreen_2.png" type="image/x-icon">
    <script src="./js/templates/youlostTemplate.js"></script>
    <script src="./js/templates/youWonTemplate.js"></script>
    <script type="module" src="./js/game.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <h1>El POLLO LOCO</h1>
        <h2>Level 1</h2>
    </div>
    <div id="startScreen" class="start_container">
        <img class="startScreenImg" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="start_screen_of_game">
        <button onclick="startGame()">Start >></button>
    </div>
    <div id="EndScreen" class="start_container">
        <img class="EndScreenImg" src="img/5_background/first_half_background.png" alt="end_screen_of_game">
    </div>
    <div id="fullscreen">
        <img class="fullscreenBtn" onclick="fullscreenStart()" src="./img/logos/fullscreen.svg" alt="fullscreen_symbol">
        <canvas id="canvas" width="720" height="480"></canvas>
    </div>
    <div class="responsiveControls" id="responsiveKontrols">
            <div>
                <img src="img/responsiveControlsImages/goBack.svg" alt="go_back_button">
                <img src="img/responsiveControlsImages/run.svg" alt="run_button">
            </div>
            <div>
                <img src="img/responsiveControlsImages/jump.svg" alt="jump_button">
                <img src="img/responsiveControlsImages/bottol.svg" alt="throw_bottol">
            </div>
        </div>
    <div class="PlayDetails">
        <h3>Arrow Left/Right = Walk</h3>
        <h3>Space = Jump</h3>
        <h3>Press D = Throw Bottles</h3>
    </div>
    </div>
    <h2><a target="_blank" href="./impressum.html">Impressum</a></h2>
</body>

</html>
