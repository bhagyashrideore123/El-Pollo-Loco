<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El-Pollo-Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/9_intro_outro_screens/start/startscreen_2.png" type="image/x-icon">
    <script type="module" src="./js/game.js" defer></script>
</head>

<body>

    <div class="wrapper">
        <h1>El POLLO LOCO</h1>
        <h2>Level 1</h2>
    </div>
    <div id="gameContainer" class="gameConrolWrapper">

        <!-- Sound and Fullscreen Buttons -->
        <div class="gameControls">
            <button id="fullscreenBtn" class="fullscreenBtn">⛶</button>
            <button id="soundBtn" class="soundBtn">🔇</button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="start_container">
            <img class="startScreenImg" src="img/9_intro_outro_screens/start/startscreen_1.png"
                alt="start_screen_of_game">
            <button id="startGameBtn">Start >></button>
        </div>

        <!-- Canvas Container -->
        <div id="canvasStyle">
            <canvas id="canvas" width="720" height="480"></canvas>
        </div>

    </div>
    <!-- modal, placed inside gameContainer or right after it -->
    <div id="impressumModal" class="modalOverlay">
        <div class="modalBox">
            <button id="closeImpressum" class="modalClose">✕</button>
            <h1>Impressum - El Pollo Loco</h1>
            <!-- same content sections as before -->
        </div>
    </div>
    <!-- yopu lost screen -->
    <div id="lostScreen" class="flexClass flexStyles">
        <img class="youLostImg" src="img/You won, you lost/You lost.png" alt="you_lost_screen">
        <button id="restart">Restart >></button>
    </div>
    <!-- you won screen -->
    <div id="wonScreen" class="flexClass flexStyles">
        <img class="youWonImg" src="img/You won, you lost/You won A.png" alt="you_win_screen">
        <button id="playAgain">Play Again >></button>
    </div>

    <div class="responsiveControls" id="responsiveKontrols">
        <div>
            <img class="resControl" id="goBack" src="img/responsiveControlsImages/goBackward.svg" alt="go_back_button">
            <img class="resControl" id="goForward" src="img/responsiveControlsImages/goForward.svg" alt="run_button">
        </div>
        <div>
            <img class="resControl" id="jump" src="img/responsiveControlsImages/goJump.svg" alt="jump_button">
            <img class="resControl" id="throwBottol" src="img/responsiveControlsImages/bottol.svg" alt="throw_bottol">
        </div>
    </div>
    <div class="PlayDetails">
        <h3>Arrow Left/Right = Walk</h3>
        <h3>Space = Jump</h3>
        <h3>Press D = Throw Bottles</h3>
    </div>
    </div>
   <button id="impressumBtn" class="impressumLink">Impressum</button>
</body>

</html>
