<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El-Pollo-Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/9_intro_outro_screens/start/startscreen_2.png" type="image/x-icon">
    <script type="module" src="./js/game.js" defer></script>
</head>

<body>
  
    <div class="wrapper">
        <h1>El POLLO LOCO</h1>
        <h2>Level 1</h2>
    </div>
    <div id="gameContainer" style="position: relative; display: inline-block; max-width: 720px; width: 100%;">
    
    <!-- Sound and Fullscreen Buttons -->
    <div style="position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 1000;">
        <button id="fullscreenBtn" class="fullscreenBtn">⛶</button>
        <button id="soundBtn" class="soundBtn">🔇</button>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="start_container">
        <img class="startScreenImg" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="start_screen_of_game">
        <button id="startGameBtn">Start >></button>
    </div>

    <!-- Canvas Container -->
    <div id="canvasStyle">
        <canvas id="canvas" width="720" height="480"></canvas>
    </div>

</div>

    <!-- yopu lost screen -->
    <div id="lostScreen" class="flexClass">
        <img class="youLostImg" src="img/You won, you lost/You lost.png" alt="you_lost_screen">
        <button id="restart">Restart Game</button>
    </div>
    <!-- you won screen -->
    <div id="wonScreen" class="flexClass">
        <img class="youWonImg" src="img/You won, you lost/You won A.png" alt="you_win_screen">
        <button id="playAgain">Play Again</button>
    </div>

    <div class="responsiveControls" id="responsiveKontrols">
        <div>
            <img src="img/responsiveControlsImages/goBack.svg" alt="go_back_button">
            <img src="img/responsiveControlsImages/run.svg" alt="run_button">
        </div>
        <div>
            <img src="img/responsiveControlsImages/jump.svg" alt="jump_button">
            <img src="img/responsiveControlsImages/bottol.svg" alt="throw_bottol">
        </div>
    </div>
    <div class="PlayDetails">
        <h3>Arrow Left/Right = Walk</h3>
        <h3>Space = Jump</h3>
        <h3>Press D = Throw Bottles</h3>
    </div>
    </div>
    <h2><a target="_blank" href="./impressum.html">Impressum</a></h2>
</body>

</html>
